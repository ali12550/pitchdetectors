        </div>

        <div class="calc-box">
            <label>BPM (Beats Per Minute)</label>

            <label style="margin-top:15px;">Beats Per Measure</label>

            <label style="margin-top:15px;">Total Measures</label>
            <input type="number" id="measures" class="form-control" placeholder="e.g., 120" />

            <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="calculateLength()">Calculate
                Length</button>

            <div class="result-box" id="result" style="display:none;">
                <h3>Song Length</h3>
                <p><strong>Total Time:</strong> <span id="timeFull"></span></p>
                <p><strong>Seconds:</strong> <span id="timeSec"></span></p>
            </div>

  <script defer>


    window.addEventListener("load", () => {
      Promise.all([
        fetch("../../header.html").then(res => res.text()),
        fetch("../../footer.html").then(res => res.text())
      ])
        .then(([header, footer]) => {
          document.getElementById("header").innerHTML = header;
          document.getElementById("footer").innerHTML = footer;
        })
        .catch(err => console.error("Include load failed:", err));
    });

  </script>
<!-- tools js -->
    <script defer>
        function calculateLength() {
            const bpm = parseFloat(document.getElementById('bpm').value);
            const beatsPerMeasure = parseFloat(document.getElementById('beatsPerMeasure').value);
            const measures = parseFloat(document.getElementById('measures').value);

            if (!bpm || !beatsPerMeasure || !measures || bpm <= 0) {
                alert("Please enter valid values.");
                return;
            }

            const totalBeats = beatsPerMeasure * measures;
            const seconds = (totalBeats / bpm) * 60;

            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);

            document.getElementById('timeFull').textContent = `${mins} min ${secs} sec`;
            document.getElementById('timeSec').textContent = seconds.toFixed(2);
            document.getElementById('result').style.display = 'block';
        }
    </script>
